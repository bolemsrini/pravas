<!-- Navigation Header -->
<header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <a href="index.html" class="logo">
      <img src="/images/PCLogo.png" alt="PRAVAS CONSULTANTS Logo" width="180" height="50" fetchpriority="high" />
    </a>

    <!-- Mobile Nav Toggle -->
    <button 
      id="mobile-menu-btn" 
      class="md:hidden text-2xl text-white focus:outline-none p-2 rounded-lg hover:bg-slate-800 transition" 
      aria-label="Toggle Navigation"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <i id="mobile-menu-icon" class="fa-solid fa-bars"></i>
    </button>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
      <a href="index.html" class="hover:text-amber-400 transition">Home</a>
      <a href="destinations.html" class="hover:text-amber-400 transition">Destinations</a>
      <a href="services.html" class="hover:text-amber-400 transition">Services</a>
      <a href="about-us.html" class="hover:text-amber-400 transition">About</a>
      <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
    </nav>

    <!-- Desktop CTA -->
    <div class="hidden md:block">
      <a href="book-consultation.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2.5 rounded-lg transition shadow-md">
        Book Free Consultation
      </a>
    </div>
  </div>

  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-slate-800 border-t border-slate-700 shadow-xl">
    <nav class="px-4 py-4 space-y-2 text-center">
      <a href="index.html" class="block py-2.5 px-4 hover:bg-slate-700 rounded-lg transition">Home</a>
      <a href="destinations.html" class="block py-2.5 px-4 hover:bg-slate-700 rounded-lg transition">Destinations</a>
      <a href="services.html" class="block py-2.5 px-4 hover:bg-slate-700 rounded-lg transition">Services</a>
      <a href="about-us.html" class="block py-2.5 px-4 hover:bg-slate-700 rounded-lg transition">About</a>
      <a href="contact.html" class="block py-2.5 px-4 hover:bg-slate-700 rounded-lg transition">Contact</a>
      <a href="book-consultation.html" class="block mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 rounded-lg transition shadow-md">
        Book Free Consultation
      </a>
    </nav>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menuBtn = document.getElementById("mobile-menu-btn");
      const menuIcon = document.getElementById("mobile-menu-icon");
      const mobileMenu = document.getElementById("mobile-menu");
      const currentPage = window.location.pathname.split("/").pop() || "index.html";

      // 1. Highlight active links differently for desktop vs mobile
      const desktopLinks = document.querySelectorAll("header nav.hidden.md\\:flex a");
      desktopLinks.forEach(link => {
        if (link.getAttribute("href") === currentPage) {
          link.classList.add("text-amber-400", "border-b-2", "border-amber-400", "pb-1", "font-semibold");
          link.classList.remove("hover:text-amber-400");
          link.setAttribute("aria-current", "page");
        }
      });

      const mobileLinks = document.querySelectorAll("#mobile-menu nav a");
      mobileLinks.forEach(link => {
        if (link.getAttribute("href") === currentPage && !link.classList.contains("bg-amber-500")) {
          link.classList.add("text-amber-400", "bg-slate-700/60", "font-semibold");
          link.setAttribute("aria-current", "page");
        }
      });

      // 2. Mobile Menu Toggle Logic
      if (menuBtn && mobileMenu) {
        const toggleMenu = (open) => {
          const isOpen = open !== undefined ? open : mobileMenu.classList.contains("hidden");
          mobileMenu.classList.toggle("hidden", !isOpen);
          menuBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");

          if (menuIcon) {
            menuIcon.classList.toggle("fa-bars", !isOpen);
            menuIcon.classList.toggle("fa-xmark", isOpen);
          }
        };

        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleMenu();
        });

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
            toggleMenu(false);
          }
        });

        // Close menu on ESC key press
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            toggleMenu(false);
          }
        });
      }
    });
  </script>
</header>
