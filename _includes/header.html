<!-- Navigation Header -->
<header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <!-- Logo with Responsive Width -->
    <a href="index.html" class="logo shrink-0 flex items-center">
      <img 
        src="/images/PCLogo.png" 
        alt="PRAVAS CONSULTANTS Logo" 
        class="max-w-[140px] sm:max-w-[180px] w-auto h-auto object-contain" 
        fetchpriority="high" 
      />
    </a>

    <!-- Mobile Nav Toggle Button -->
    <button 
      id="mobile-menu-btn" 
      class="md:hidden text-2xl text-white focus:outline-none p-3 rounded-lg hover:bg-slate-800 transition min-w-[44px] min-h-[44px] flex items-center justify-center" 
      aria-label="Toggle Navigation"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <i id="mobile-menu-icon" class="fa-solid fa-bars"></i>
    </button>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
      <a href="index.html" class="hover:text-amber-400 transition">Home</a>
      <a href="destinations.html" class="hover:text-amber-400 transition">Destinations</a>
      <a href="services.html" class="hover:text-amber-400 transition">Services</a>
      <a href="about-us.html" class="hover:text-amber-400 transition">About</a>
      <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
    </nav>

    <!-- Desktop CTA -->
    <div class="hidden md:block shrink-0">
      <a href="book-consultation.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2.5 rounded-lg transition shadow-md">
        Book Free Consultation
      </a>
    </div>
  </div>

  <!-- Mobile Navigation Menu (Smooth Dropdown Container) -->
  <div 
    id="mobile-menu" 
    class="md:hidden hidden bg-slate-800 border-t border-slate-700 shadow-xl transition-all duration-300 ease-in-out"
  >
    <nav class="px-4 py-4 space-y-2 text-center">
      <a href="index.html" class="block py-3 px-4 hover:bg-slate-700 rounded-lg transition min-h-[44px] flex items-center justify-center">Home</a>
      <a href="destinations.html" class="block py-3 px-4 hover:bg-slate-700 rounded-lg transition min-h-[44px] flex items-center justify-center">Destinations</a>
      <a href="services.html" class="block py-3 px-4 hover:bg-slate-700 rounded-lg transition min-h-[44px] flex items-center justify-center">Services</a>
      <a href="about-us.html" class="block py-3 px-4 hover:bg-slate-700 rounded-lg transition min-h-[44px] flex items-center justify-center">About</a>
      <a href="contact.html" class="block py-3 px-4 hover:bg-slate-700 rounded-lg transition min-h-[44px] flex items-center justify-center">Contact</a>
      <a href="book-consultation.html" class="block mt-4 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 px-4 rounded-lg transition shadow-md min-h-[44px] flex items-center justify-center">
        Book Free Consultation
      </a>
    </nav>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const menuBtn = document.getElementById("mobile-menu-btn");
      const menuIcon = document.getElementById("mobile-menu-icon");
      const mobileMenu = document.getElementById("mobile-menu");
      
      // Determine active page name
      const path = window.location.pathname;
      const currentPage = path.substring(path.lastIndexOf('/') + 1) || "index.html";

      // 1. Highlight Desktop Active Links
      const desktopLinks = document.querySelectorAll("header nav.hidden.md\\:flex a");
      desktopLinks.forEach(link => {
        const href = link.getAttribute("href");
        if (href === currentPage) {
          link.classList.add("text-amber-400", "border-b-2", "border-amber-400", "pb-1", "font-semibold");
          link.classList.remove("hover:text-amber-400");
          link.setAttribute("aria-current", "page");
        }
      });

      // 2. Highlight Mobile Active Links
      const mobileLinks = document.querySelectorAll("#mobile-menu nav a");
      mobileLinks.forEach(link => {
        const href = link.getAttribute("href");
        if (href === currentPage && !link.classList.contains("bg-amber-500")) {
          link.classList.add("text-amber-400", "bg-slate-700/60", "font-semibold");
          link.setAttribute("aria-current", "page");
        }
      });

      // 3. Mobile Menu Toggle Logic
      if (menuBtn && mobileMenu) {
        const toggleMenu = (shouldOpen) => {
          const isOpen = shouldOpen !== undefined ? shouldOpen : mobileMenu.classList.contains("hidden");
          
          if (isOpen) {
            mobileMenu.classList.remove("hidden");
            document.body.classList.add("overflow-hidden"); // Prevent background scroll when menu is open
          } else {
            mobileMenu.classList.add("hidden");
            document.body.classList.remove("overflow-hidden");
          }

          menuBtn.setAttribute("aria-expanded", isOpen ? "true" : "false");

          if (menuIcon) {
            menuIcon.classList.toggle("fa-bars", !isOpen);
            menuIcon.classList.toggle("fa-xmark", isOpen);
          }
        };

        // Toggle button click handler
        menuBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          toggleMenu();
        });

        // Close menu when clicking any mobile link
        mobileLinks.forEach(link => {
          link.addEventListener("click", () => {
            toggleMenu(false);
          });
        });

        // Close menu when tapping outside header
        document.addEventListener("click", (e) => {
          if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
            toggleMenu(false);
          }
        });

        // Close menu on ESC key press
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            toggleMenu(false);
          }
        });
      }
    });
  </script>
</header>
