<!-- Navigation Header -->
<header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
    <a href="index.html" class="logo">
      <img src="/images/PCLogo.png" alt="PRAVAS CONSULTANTS Logo" width="180" height="50" fetchpriority="high" />
    </a>
    <!-- Mobile Nav Toggle -->
    <button id="mobile-menu-btn" class="md:hidden text-2xl text-white focus:outline-none" aria-label="Toggle Navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium">
      <a href="index.html" class="hover:text-amber-400 transition">Home</a>
      <a href="destinations.html" class="hover:text-amber-400 transition">Destinations</a>
      <a href="services.html" class="hover:text-amber-400 transition">Services</a>
      <a href="about-us.html" class="hover:text-amber-400 transition">About</a>
      <a href="contact.html" class="hover:text-amber-400 transition">Contact</a>
    </nav>
    <!-- Desktop CTA -->
    <div class="hidden md:block">
      <a href="book-consultation.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-5 py-2.5 rounded-lg transition shadow-md">
        Book Free Consultation
      </a>
    </div>
  </div>
  <!-- Mobile Navigation Menu -->
  <div id="mobile-menu" class="hidden md:hidden bg-slate-800 border-t border-slate-700">
    <nav class="px-4 py-4 space-y-3 text-center">
      <a href="index.html" class="block py-2 hover:bg-slate-700 rounded transition">Home</a>
      <a href="destinations.html" class="block py-2 hover:bg-slate-700 rounded transition">Destinations</a>
      <a href="services.html" class="block py-2 hover:bg-slate-700 rounded transition">Services</a>
      <a href="about-us.html" class="block py-2 hover:bg-slate-700 rounded transition">About</a>
      <a href="contact.html" class="block py-2 hover:bg-slate-700 rounded transition">Contact</a>
      <a href="book-consultation.html" class="block mt-4 bg-amber-500 text-slate-950 font-semibold py-3 rounded-lg transition shadow-md">
        Book Free Consultation
      </a>
    </nav>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // Get current filename (e.g., "destinations.html" or default to "index.html")
    const currentPage = window.location.pathname.split("/").pop() || "index.html";
    
    // Target desktop and mobile navigation links
    const navLinks = document.querySelectorAll("header nav a");

    navLinks.forEach(link => {
      const linkPage = link.getAttribute("href");
      
      if (linkPage === currentPage) {
        // Highlight active link
        link.classList.add("text-amber-400", "border-b-2", "border-amber-400", "pb-1", "font-semibold");
        link.classList.remove("hover:text-amber-400");
        link.setAttribute("aria-current", "page");
      }
    });
  });
</script>
</header>
