<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pravas Consultants | Overseas Education</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="Pravas Consultants Logo">
      </a>
      <button class="mobile-nav-toggle" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="#destinations">Destinations</a>
        <a href="#services">Services</a>
        <a href="about-us.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="book-consultation.html" class="btn-primary">Book Free Consultation</a>
      </nav>
    </div>
  </header>

  <!-- Promotional Modal Pop-up -->
  <div id="adModal" class="ad-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="ad-modal-content">
      <!-- Close Button -->
      <button class="ad-close-btn" id="closeAdBtn" aria-label="Close Modal">&times;</button>
      
      <!-- Ad Banner Image -->
      <a href="book-consultation.html">
        <img src="images/special-offer-banner.jpg" alt="Special Offer - Book Consultation" class="ad-banner-img">
      </a>
      
      <!-- Modal Text & CTA -->
      <div class="ad-body">
        <h3 id="modalTitle">Special Intake Offer!</h3>
        <p>Get free counseling and profile evaluation for Fall 2026 admissions.</p>
        <a href="book-consultation.html" class="btn-ad-cta">Claim Your Free Spot</a>
      </div>
    </div>
  </div>

  <!-- JavaScript Section -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Navigation Toggle
      const navToggle = document.querySelector('.mobile-nav-toggle');
      const navLinks = document.querySelector('.nav-links');

      if (navToggle && navLinks) {
        navToggle.addEventListener('click', () => {
          navLinks.classList.toggle('active');
          const icon = navToggle.querySelector('i');
          if (icon) {
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-xmark');
          }
        });
      }

      // Promotional Modal Handler
      const adModal = document.getElementById('adModal');
      const closeBtn = document.getElementById('closeAdBtn');

      const closeModal = () => {
        if (adModal) adModal.style.display = 'none';
      };

      if (adModal) {
        // Automatically show modal after 1 second
        setTimeout(() => {
          adModal.style.display = 'flex';
        }, 1000);

        // Close on 'X' button click
        if (closeBtn) {
          closeBtn.addEventListener('click', closeModal);
        }

        // Close on backdrop click
        window.addEventListener('click', (e) => {
          if (e.target === adModal) {
            closeModal();
          }
        });
      }
    });
  </script>
</body>
</html>
